  <main class="container">
    <h1>Prova do Módulo 3</h1>
    <p class="legenda">Partição de equivalência, valor limite, tabela de decisão, transição de estado, pairwise. &nbsp;<a href="modulo-3.html">← rever o módulo</a></p>
    <div id="prova"></div>
  </main>

  <script>
  window.PROVA = {
    titulo: "Módulo 3", trilha: "fundamentos", modulo: 3, indiceHref: "index.html",
    questoes: [
      { t: "mc",
        enun: "Um campo aceita idade de <b>18 a 65</b>. Qual conjunto reflete melhor a análise de valor limite?",
        ops: [
          "17, 18, 19, 64, 65, 66",
          "18, 30, 65",
          "0, 18, 65, 120",
          "1, 2, 3, 63, 64, 65" ],
        correta: 0,
        exp: "Em cada fronteira você testa o valor de dentro, o exato e o de fora. 18 e 65 são os pontos onde alguém troca <code>&gt;=</code> por <code>&gt;</code>." },

      { t: "mc",
        enun: "Qual é a ideia central da partição de equivalência?",
        ops: [
          "Valores tratados do mesmo jeito pelo sistema formam uma classe; basta um representante de cada",
          "Testar sempre os extremos de cada faixa de valores",
          "Dividir os casos de teste igualmente entre as pessoas do time",
          "Cobrir todas as combinações possíveis de entradas" ],
        correta: 0,
        exp: "Se 37 e 45 percorrem o mesmo caminho no código, testar os dois não acrescenta informação. Um representante por classe, e não esqueça das classes <b>inválidas</b>." },

      { t: "mc",
        enun: "A regra diz: \"desconto de 10% para VIP, 15% com cupom, 20% para quem tem os dois\". Qual técnica você usa e qual é o caso mais importante?",
        ops: [
          "Tabela de decisão; o caso mais importante é VIP <b>e</b> cupom: é onde o sistema costuma somar 10+15 e dar 25%",
          "Valor limite; o caso mais importante é o desconto de exatamente 15%",
          "Transição de estado; o mais importante é sair de VIP para não-VIP",
          "Partição de equivalência; basta um teste para cada percentual" ],
        correta: 0,
        exp: "Quando o resultado depende da <i>combinação</i> de condições, a tabela de decisão força olhar os cruzamentos, e é no cruzamento que mora o defeito." },

      { t: "mc",
        enun: "Um pedido percorre <code>novo → pago → enviado → entregue</code>, podendo ser cancelado enquanto está novo ou pago. Onde está o teste mais valioso?",
        ops: [
          "Nas transições <b>proibidas</b>: tentar cancelar um pedido já entregue, ou entregar um pedido nunca pago",
          "Em cada estado isoladamente, verificando o texto exibido",
          "No caminho feliz completo, do novo até o entregue",
          "Na quantidade de pedidos em cada estado" ],
        correta: 0,
        exp: "O caminho feliz quase sempre já funciona. O defeito mora na transição que não deveria ser permitida, e que a interface esconde, mas a API não." },

      { t: "mc",
        enun: "Qual destes valores costuma quebrar sistema e <b>não</b> aparece escrito em quase nenhum requisito?",
        ops: [
          "A lista com exatamente 1 item, e a lista vazia",
          "Um valor no meio da faixa permitida",
          "O valor típico usado em demonstrações",
          "O segundo maior valor da faixa" ],
        correta: 0,
        exp: "Zero e um são os limites esquecidos: quebram paginação, concordância de texto (\"1 itens\") e cálculos de média. Junto com vazio, nulo, tamanho máximo e datas de virada." },

      { t: "mc",
        enun: "Você precisa cobrir 4 navegadores × 3 sistemas × 3 perfis × 2 idiomas = 72 combinações, e não há tempo. Qual a abordagem defensável?",
        ops: [
          "Teste por pares (<i>pairwise</i>): garantir que cada par de valores apareça ao menos uma vez",
          "Escolher uma combinação só, a mais usada pelos clientes",
          "Testar todas as 72, dividindo entre o time",
          "Sortear 10 combinações aleatoriamente" ],
        correta: 0,
        exp: "A maioria dos defeitos de combinação surge da interação de <b>duas</b> variáveis. Cobrindo todos os pares, as 72 combinações costumam cair para menos de 15." },

      { t: "mc",
        enun: "Ao montar a tabela de teste você percebe que não sabe o que escrever na coluna \"resultado esperado\" de uma das linhas. O que isso significa?",
        ops: [
          "Você encontrou uma ambiguidade no requisito, e isso vale mais do que um bug",
          "Você escolheu a técnica errada; troque de técnica",
          "Aquele caso não é testável e deve ser descartado",
          "É preciso olhar o código para descobrir o comportamento correto" ],
        correta: 0,
        exp: "Sem oráculo não há teste. Uma especificação que não responde precisa ser decidida por alguém, e quanto antes, mais barato. Olhar o código responderia \"o que faz\", não \"o que deveria fazer\"." },

      { t: "mc",
        enun: "A regra diz \"frete grátis para pedidos <b>acima de</b> R$ 300\". Qual a atitude correta ao testar R$ 300,00 exatos?",
        ops: [
          "Testar e, se a especificação não disser claramente se 300 entra, levar a dúvida ao time",
          "Assumir que 300 tem frete grátis e seguir em frente",
          "Assumir que 300 paga frete e seguir em frente",
          "Pular o caso, já que 300 não está \"acima de\" 300" ],
        correta: 0,
        exp: "O valor exato da fronteira é o caso que mais quebra <i>e</i> o que mais expõe ambiguidade. Assumir em silêncio é como o defeito entra na especificação." },

      { t: "aberta",
        enun: "Requisito: <i>\"O campo <b>quantidade</b> de um item no carrinho aceita de 1 a 99 unidades. Acima do estoque disponível, o sistema deve avisar e limitar à quantidade em estoque.\"</i><br><br>Escreva os casos de teste indicando <b>qual técnica gerou cada um</b>.",
        dica: "passe as quatro técnicas em ordem; não esqueça das classes inválidas e do que o requisito não diz.",
        modelo: "<p><b>Partição de equivalência</b></p><ul><li>válida: quantidade dentro da faixa e dentro do estoque (ex.: 5, com estoque 20)</li><li>inválida: 0 · negativo (-1) · texto (\"abc\") · vazio · decimal (2,5) · espaço em branco</li></ul><p><b>Valor limite</b></p><ul><li>0 / <b>1</b> / 2: fronteira inferior</li><li>98 / <b>99</b> / 100: fronteira superior</li><li>estoque−1 / <b>estoque exato</b> / estoque+1: a outra fronteira, a que o requisito introduz</li></ul><p><b>Tabela de decisão</b>: duas condições: dentro de 1–99? dentro do estoque?</p><ul><li>dentro / dentro → aceita normalmente</li><li>dentro / acima do estoque → avisa e limita ao estoque</li><li>acima de 99 / estoque maior que 99 → <b>o requisito não diz</b>: limita a 99? avisa o quê? <i>(ambiguidade a levar ao time)</i></li><li>fora da faixa / fora do estoque → qual mensagem vence?</li></ul><p><b>Transição de estado / sequência</b></p><ul><li>colocar 50, depois reduzir para 1, depois subir de novo</li><li>colocar quantidade válida e o estoque cair para menos que isso antes de finalizar</li><li>duas abas abertas alterando a quantidade do mesmo item</li><li>quantidade limitada automaticamente ao estoque: o preço total recalcula junto?</li></ul><p><b>Limites esquecidos</b>: estoque igual a 0 (o campo deveria nem aparecer?), estoque exatamente 1, colar um número com 10 dígitos no campo.</p><p>Se você achou o caso de <i>\"acima de 99 com estoque maior que 99\"</i>, muito bem: o requisito realmente não resolve esse conflito, e essa é a pergunta que vale ouro no refinamento.</p>" }
    ]
  };
  </script>
