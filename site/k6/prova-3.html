            "modelo": "<pre class=\"bloco\"><code>export const options = {\n  stages: [\n    { duration: \"1m\", target: 200 },   // sobe\n    { duration: \"5m\", target: 200 },   // patamar: e aqui que se mede\n    { duration: \"1m\", target: 0 },     // desce\n  ],\n  thresholds: {\n    http_req_failed:   [\"rate&lt;0.01\"],    // menos de 1% de erro\n    http_req_duration: [\"p(95)&lt;800\", \"max&lt;3000\"],\n    checks:            [\"rate&gt;0.99\"],\n  },\n};</code></pre><p><b>Se reprovar</b>, a sequência é investigar antes de concluir:</p><ol><li><b>Qual threshold estourou?</b> O resumo diz exatamente qual. Erro alto e tempo alto apontam para causas diferentes.</li><li><b>Quando começou a degradar?</b> Olhar a curva: foi desde o início (o sistema já não aguenta a carga base) ou só depois de certo ponto do patamar (esgotamento progressivo: conexões, memória, pool do banco)?</li><li><b>Onde?</b> Com <code>group()</code>, ver qual etapa puxou o p95 para cima. Frequentemente é uma só.</li><li><b>É o sistema ou o teste?</b> O gerador de carga saturou? A máquina que roda o k6 tem CPU e rede suficientes? Dado fixo demais criou disputa artificial por um registro? Ambiente de teste é menor que produção?</li><li><b>É dependência externa?</b> Pagamento ou antifraude em sandbox pode ser o gargalo, e aí você mediu o terceiro, não o seu sistema.</li><li><b>Relatar</b> com o número, a carga em que aconteceu, a curva e a etapa específica: <i>\"o p95 do checkout passa de 800ms a partir de 140 VUs; abaixo disso fica em 310ms\"</i> é acionável. <i>\"está lento\"</i> não é.</li></ol><p>E o mais importante: <b>reprovar não é falha do teste, é o teste funcionando</b>. A decisão do que fazer, aumentar capacidade, otimizar, ou aceitar e adiar, é do time, com a informação que você produziu.</p>",
