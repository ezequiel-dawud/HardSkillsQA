            "modelo": "<p>Portão de performance mal calibrado é pior que não ter: o time aprende a ignorar o vermelho (Módulo 3 de CI/CD). Os cuidados:</p><ul><li><b>Limite com folga sobre a realidade medida.</b> Meça primeiro em condições normais e coloque o threshold acima do observado, não colado nele. Threshold no limite do que já acontece falha por ruído.</li><li><b>Ambiente estável e dedicado.</b> Rodar carga numa máquina compartilhada, que às vezes está ocupada, produz números diferentes a cada execução. Se não der para isolar, o portão precisa ser mais frouxo, e isso deve estar documentado.</li><li><b>Percentil, não máximo.</b> Um <code>max&lt;3000</code> quebra com um único pico aleatório. Use p95 ou p99 como portão principal, e o máximo apenas para casos realmente inaceitáveis.</li><li><b>Carga curta no PR, longa fora dele.</b> Um smoke de carga de 1–2 minutos a cada PR; o teste de carga completo agendado à noite. Pipeline de PR que demora 40 minutos ninguém espera.</li><li><b>Só o fluxo que importa.</b> Portão no checkout e no login; não em toda rota do sistema.</li><li><b>Dado variado e massa recriada.</b> Senão a segunda execução mede cache e a base cresce indefinidamente entre rodadas.</li><li><b>Excluir o que não é seu.</b> Dependência externa em sandbox pode ser o gargalo, e você reprovaria o próprio build por causa do terceiro.</li><li><b>Revisar periodicamente.</b> O sistema muda; um limite definido há um ano pode estar frouxo demais ou apertado demais.</li><li><b>Combinar antes.</b> O time precisa concordar que o vermelho <b>barra a entrega</b>. Portão que todo mundo ignora é só um teste caro.</li></ul><p>A regra que resume tudo: <b>um portão só vale se o time confia nele o bastante para parar quando ele fecha.</b></p>",
