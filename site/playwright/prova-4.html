    <p class="legenda"><code>page.route</code>, atalho de login via localStorage, o que muda pro CI. &nbsp;<a href="modulo-4.html">← rever o módulo</a></p>
    <div id="prova"></div>

    questoes: [
      {
            "t": "mc",
            "enun": "O que <code>page.route()</code> faz, na prática?",
            "ops": [
                  "Intercepta uma requisição antes dela sair do navegador, permitindo decidir a resposta sem depender do servidor real",
                  "Redireciona a página inteira pra outra URL",

                  "Grava um log de todas as requisições, sem alterar nenhuma resposta"

            "correta": 0,
            "exp": "É o equivalente Playwright do cy.intercept do Cypress: mock/stub de rede no nível do navegador."
      },
      {
            "t": "mc",
            "enun": "Qual a vantagem de testar um cenário de erro (como um 503 de manutenção) com <code>page.route</code> em vez de depender do servidor real produzir esse erro?",
            "ops": [
                  "Permite testar cenários que o servidor real não reproduz de forma confiável (como um erro específico ou um timeout), sem depender de derrubar algo de verdade",

            "enun": "Quando faz sentido pular o login com <code>addInitScript</code> em vez de passar pela tela de login de verdade?",

                  "Quando o login já foi testado em outro teste e, neste, ele é só um pré-requisito pra testar outra coisa",
                  "Sempre, em todo teste, pra deixar a suíte mais rápida",
                  "Nunca, é considerado uma prática não recomendada",
                  "Só quando o servidor de login está fora do ar"
            ],
            "correta": 0,
            "exp": "Se o teste é sobre o login, passar pela UI de verdade. Se é só pré-requisito, pular é mais rápido e mais estável."
      },
      {
            "t": "mc",
            "enun": "O que já funciona \"de graça\" ao rodar <code>npx playwright test</code> num servidor de CI, sem nenhuma configuração extra?",
            "ops": [

      {
            "t": "aberta",
            "enun": "Seu time quer que a suíte de Playwright rode automaticamente a cada pull request, igual a Trilha 6 (CI/CD) ensinou pra pytest. Que perguntas e passos você levantaria antes de escrever o workflow?",
            "modelo": "<p>A lógica é a mesma da Trilha 6: automatizar os mesmos comandos que já rodam manualmente. Mas automação de navegador tem particularidades:</p><ul><li><b>O alvo precisa estar de pé antes dos testes.</b> No CI isso significa subir o site de treino (ou apontar pra um ambiente já publicado) como um passo do workflow, antes de rodar os testes, e esperar ele responder antes de seguir, não só disparar e torcer.</li><li><b>Instalar o navegador no runner.</b> O ambiente de CI começa limpo; o comando de instalar o Chromium (com as dependências de sistema, não só o binário) precisa ser um passo explícito.</li><li><b>Tempo de execução.</b> Testes de navegador são mais lentos que testes de API/unitários, vale medir quanto a suíte demora e decidir se roda em todo PR ou só antes de mergear.</li><li><b>O que fazer quando falha.</b> Diferente de um assert de API, um teste de UI que falha se beneficia de evidência visual: trace, screenshot, vídeo no momento da falha, publicados como artefato do CI pra quem for investigar não precisar rodar local pra reproduzir.</li><li><b>Flakiness.</b> Antes de confiar o merge a essa suíte, rodar ela várias vezes seguidas localmente (ou no próprio CI) pra garantir que não falha aleatoriamente: um teste de UI instável que bloqueia PRs de verdade vira motivo pra ninguém confiar nele.</li></ul><p>No fim, a pergunta que mais importa é a mesma da Trilha 6: se a suíte reprovar o build, alguém age? Se sim, vale o investimento de deixá-la estável antes de virar portão obrigatório.</p>",
