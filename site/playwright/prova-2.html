    <h1>Prova do Módulo 2</h1>
    <p class="legenda">Page Object Model, <code>test.describe</code>/<code>beforeEach</code>, formulário, <code>toBeVisible</code>/<code>toBeHidden</code>. &nbsp;<a href="modulo-2.html">← rever o módulo</a></p>
    <div id="prova"></div>
  </main>

  <script>
  window.PROVA = {
    titulo: "Módulo 2", trilha: "playwright", modulo: 2, indiceHref: "index.html",
    questoes: [
      {
            "t": "mc",
            "enun": "O que o Playwright garante entre um teste e o próximo dentro do mesmo <code>test.describe</code>?",
            "ops": [
                  "Cada teste recebe uma <code>page</code> nova e isolada: um não vê o estado que o outro deixou",
                  "Os testes compartilham a mesma página e o mesmo estado de navegação",
                  "O segundo teste só roda se o primeiro passar",
                  "Os testes rodam sempre na ordem em que foram escritos"
            ],
            "correta": 0,
            "exp": "Isolamento entre testes é o que torna a ordem de execução irrelevante: um teste quebrado não derruba os outros em cascata."
      },
      {
            "t": "mc",
            "enun": "Qual é o principal problema que o <b>Page Object Model</b> resolve?",
            "ops": [
                  "Se um data-testid mudar, só um lugar (a classe da página) precisa ser corrigido, em vez de caçar em todo teste que usa aquele elemento",
                  "Faz os testes rodarem mais rápido, reduzindo o tempo do navegador",
                  "É a única forma de usar test.describe no Playwright",
                  "Substitui a necessidade de escrever asserções (expect) nos testes"
            ],
            "correta": 0,
            "exp": "Centralizar locators e ações numa classe por página é o que evita repetir (e ter que corrigir em vários lugares) o mesmo seletor."
      },
      {
            "t": "mc",
            "enun": "Para que serve o <code>test.beforeEach</code>?",
            "ops": [
                  "Repetir, antes de cada teste do grupo, um preparo comum (como navegar pra uma página)",
                  "Rodar um teste extra só uma vez, antes de todos os outros",
                  "Definir o navegador usado pelos testes",
                  "Pular o próximo teste se o anterior falhar"
            ],
            "correta": 0,
            "exp": "Evita repetir a mesma sequência de passos no início de cada teste do grupo."
      },
      {
            "t": "mc",
            "enun": "Por que testar um formulário de validação deve conferir também os erros que <b>não</b> deveriam aparecer, e não só o que deveria?",
            "ops": [
                  "Porque um sistema pode acender a mensagem de erro errada pro campo certo, e um teste que só confere 'apareceu algum erro' não pegaria isso",
                  "Porque o Playwright exige pelo menos duas asserções por teste",
                  "Porque <code>toBeVisible</code> sempre precisa vir acompanhado de <code>toBeHidden</code>",
                  "Porque sem isso o teste demora mais pra rodar"
            ],
            "correta": 0,
            "exp": "Teste que só confere \"tem erro na tela\" aceita um sistema que mostra a mensagem errada pro campo certo."
      },
      {
            "t": "mc",
            "enun": "Nesta trilha, o formulário de cadastro tinha <code>required</code> nos campos de input. Qual foi o efeito disso antes da correção?",
            "ops": [
                  "A validação nativa do navegador bloqueava o envio do formulário antes do JavaScript customizado (e as mensagens com data-testid) rodar",
                  "O formulário parava de funcionar completamente",
                  "O Playwright se recusava a interagir com campos obrigatórios",
                  "As mensagens de erro apareciam em dobro"
            ],
            "correta": 0,
            "exp": "A correção foi adicionar <code>novalidate</code> no <code>&lt;form&gt;</code>, deixando só a validação customizada (testável via data-testid) rodar."
      },
      {
            "t": "mc",
            "enun": "O que <code>await expect(locator).toBeHidden()</code> espera acontecer?",
            "ops": [
                  "Espera, até o timeout, que o elemento fique invisível, com display:none, ou deixe de existir",
                  "Espera o elemento aparecer na tela",
                  "Remove o elemento do DOM imediatamente",
                  "Verifica só uma vez, sem esperar, se o elemento está escondido"
            ],
            "correta": 0,
            "exp": "É o oposto de toBeVisible(), com o mesmo auto-wait, só que esperando o elemento sumir."
      },
      {
            "t": "aberta",
            "enun": "Você encontrou um formulário de cadastro cuja validação de senha nunca falha nos seus testes automatizados, mas um usuário reportou ter criado uma conta com senha de 2 caracteres. O que você investigaria?",
            "modelo": "<p>O sintoma (teste automatizado sempre passa, mas o bug existe em produção) sugere que o teste não está exercitando o caminho real. Pontos a checar:</p><ul><li><b>Onde a validação realmente acontece:</b> só no front-end (JS) ou também no back-end? Se só no front, dá pra contornar enviando a requisição direto pra API (ferramenta, extensão, ou até desabilitando JS): o teste de UI nunca pegaria isso porque ele usa o formulário normalmente.</li><li><b>Validação nativa do navegador mascarando o teste:</b> como visto nesta trilha, um atributo como <code>minlength</code> ou <code>required</code> pode bloquear o envio antes do JS rodar. Se o teste sempre preenche uma senha \"razoável\", nunca exercita o caso de borda que o bug real usa.</li><li><b>Se o teste usa um seletor frágil</b> que não está realmente apontando pro campo de senha certo (por exemplo depois de um redesign), ele pode estar validando outro campo sem perceber.</li><li><b>Reproduzir manualmente</b> o relato do usuário primeiro, exatamente a senha, exatamente os passos, antes de mexer no teste, pra não \"consertar\" um teste que nunca estava testando o cenário certo.</li></ul><p>O ponto geral: teste de UI só cobre o que passa pela UI. Validação de segurança/negócio importante deveria existir (e ser testada) também no back-end.</p>",
            "dica": "pense em: onde a validação acontece de verdade, e se o teste está exercitando o caminho que o usuário usou."
      }
    ]
  };
  </script>
