    <h1>Prova do Módulo 3</h1>
    <p class="legenda">Login compartilhado, loading assíncrono, paginação, estado vazio, modal, upload, drag and drop. &nbsp;<a href="modulo-3.html">← rever o módulo</a></p>
    <div id="prova"></div>
  </main>

  <script>
  window.PROVA = {
    titulo: "Módulo 3", trilha: "playwright", modulo: 3, indiceHref: "index.html",
    questoes: [
      {
            "t": "mc",
            "enun": "Por que vale extrair uma função <code>login(page)</code> e chamá-la no <code>beforeEach</code>, em vez de repetir os passos de login em cada teste?",
            "ops": [
                  "Reduz repetição e centraliza a lógica: se o fluxo de login mudar, só um lugar precisa ser ajustado",
                  "É a única forma de o Playwright reconhecer uma sessão",
                  "Faz os testes rodarem em paralelo automaticamente",
                  "Evita que o Playwright precise instalar o navegador de novo"
            ],
            "correta": 0,
            "exp": "É o mesmo princípio de não repetir código em qualquer programa: testes também se beneficiam disso."
      },
      {
            "t": "mc",
            "enun": "Por que esperar <code>await expect(page).toHaveURL(/index\\.html/)</code> depois de clicar em entrar, em vez de seguir direto pro próximo passo?",
            "ops": [
                  "O clique dispara uma requisição com atraso antes do redirecionamento acontecer; sem esperar, o próximo passo pode rodar contra a tela de login ainda carregando",
                  "Só por estilo, funcionaria igual sem essa espera",
                  "Porque toHaveURL é obrigatório em todo teste do Playwright",
                  "Para medir quanto tempo o login demora"
            ],
            "correta": 0,
            "exp": "Sem essa espera o teste fica sujeito a timing: às vezes passa, às vezes falha, dependendo de quão rápido a rede responde."
      },
      {
            "t": "mc",
            "enun": "Por que nenhum teste deste módulo usa <code>sleep()</code> pra esperar o carregamento assíncrono (loading, produto, modal)?",
            "ops": [
                  "Porque esperar uma condição específica (elemento aparecer/sumir) é mais confiável do que esperar um tempo fixo, que varia entre máquinas e ambientes (como o CI, geralmente mais lento)",
                  "Porque o Playwright não tem suporte a pausas no código",
                  "Porque sleep() é mais lento de executar que expect()",
                  "Porque o site de treino não tem nenhum atraso de rede"
            ],
            "correta": 0,
            "exp": "Esperar tempo fixo cedo demais é uma causa clássica de teste instável (flaky): passa na sua máquina, falha no CI."
      },
      {
            "t": "mc",
            "enun": "O que <code>setInputFiles()</code> faz, que o diferencia de abrir o seletor de arquivo do sistema operacional?",
            "ops": [
                  "Anexa o arquivo programaticamente ao input, sem precisar interagir com uma janela nativa do SO (que o Playwright não consegue controlar)",
                  "Só funciona se o campo não tiver o atributo accept",
                  "Faz upload do arquivo direto pro servidor, pulando o campo de input",
                  "Abre uma cópia virtual do explorador de arquivos dentro do navegador"
            ],
            "correta": 0,
            "exp": "Janelas nativas do sistema operacional ficam fora do alcance do Playwright (ele controla o navegador, não o SO); setInputFiles contorna isso."
      },
      {
            "t": "mc",
            "enun": "Testando a galeria de drag and drop, por que o teste confere a nova ordem lendo os <code>data-testid</code> dos itens, em vez de só verificar que o <code>.dragTo()</code> não lançou erro?",
            "ops": [
                  "Porque o .dragTo() pode completar sem erro mesmo que a página não reaja do jeito esperado ao evento: só checar \"não deu erro\" não garante que o comportamento certo aconteceu",
                  "Porque o dragTo() nunca lança erro, em nenhuma situação",
                  "Porque ler data-testid é mais rápido que usar dragTo()",
                  "Porque a ordem dos itens é definida pelo HTML e nunca muda em tempo de execução"
            ],
            "correta": 0,
            "exp": "Um dos erros mais comuns em teste de UI é confundir \"a ação não quebrou\" com \"o comportamento esperado aconteceu\". São coisas diferentes."
      },
      {
            "t": "aberta",
            "enun": "Durante o teste do modal de confirmação, você percebeu que clicar em \"adicionar ao carrinho\" antes do produto terminar de carregar simplesmente não faz nada: sem mensagem, sem erro. Isso é um bug? O que você faria com essa observação?",
            "modelo": "<p>É um problema de UX/acessibilidade, mesmo não sendo um crash: do ponto de vista do usuário, clicar num botão e nada acontecer é confuso, ele não sabe se o clique \"não registrou\", se o site travou, ou se precisa clicar de novo (o que pode gerar cliques duplicados quando o produto finalmente carregar).</p><p>Como QA, a conduta não é simplesmente ignorar por não ser um erro técnico:</p><ul><li><b>Registrar o achado</b> como um bug de UX, mesmo que de prioridade baixa: \"o botão de adicionar ao carrinho não dá feedback nenhum se clicado antes do produto carregar\".</li><li><b>Propor o comportamento esperado</b>: o botão poderia ficar desabilitado (<code>disabled</code>) até o produto carregar, ou mostrar um spinner, igual a lista de produtos já faz.</li><li><b>Adicionar um teste de regressão</b> uma vez corrigido, pra garantir que não volte: por exemplo, conferir que o botão está desabilitado enquanto o título ainda está vazio.</li><li><b>Diferenciar isso de um bug funcional</b> na comunicação com o time: não trava nada, não perde dado, mas prejudica a experiência, o que ajuda a priorizar certo.</li></ul><p>O ponto central: automação de teste não serve só pra achar crash. Observações de comportamento estranho, mesmo sem erro técnico, são parte do trabalho de QA.</p>",
            "dica": "pense em: o que o usuário real sentiria, e como isso vira um item acionável (não só uma observação solta)."
      }
    ]
  };
  </script>
