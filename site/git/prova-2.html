  <script>
  window.PROVA = {
    titulo: "Módulo 2", trilha: "git", modulo: 2, indiceHref: "index.html",
    questoes: [
      {
            "t": "mc",
            "enun": "Para que serve a área de preparo (<i>staging</i>), entre os seus arquivos e a história?",
            "ops": [
                  "Para escolher <b>o que entra em cada commit</b>, permitindo separar mudanças diferentes em commits diferentes",

            "correta": 0,
            "exp": "Commit é uma unidade de sentido, não um backup do fim do dia. Mexeu em cinco arquivos por dois motivos diferentes? Dois commits."

      {
            "t": "mc",
            "enun": "Qual comando mostra em que branch você está, o que foi modificado e o que já está preparado?",
            "ops": [
                  "<code>git status</code>",
                  "<code>git log</code>",
                  "<code>git diff</code>",
                  "<code>git show</code>"
            ],
            "correta": 0,
            "exp": "É o comando que você mais vai usar. Na dúvida sobre qualquer coisa: <code>git status</code>."
      },
      {
            "t": "mc",
            "enun": "Qual destas mensagens de commit presta?",
            "ops": [
                  "<code>corrige domínio de status aceito no teste de pedidos</code>",
                  "<code>ajustes</code>",
                  "<code>agora vai</code>",
                  "<code>alterações do dia 12</code>"

            "correta": 0,
            "exp": "A mensagem é para quem vai ler o histórico daqui a seis meses, muitas vezes você. Diga o que a mudança faz."

      {
            "t": "mc",
            "enun": "Você editou um arquivo e fez <code>git commit</code>. Onde a mudança está?",

                  "Porque os commits em branch ficam menores",

            "correta": 0,

            "correta": 0,

            "t": "aberta",
            "enun": "Você é QA e recebeu a tarefa de testar uma entrega. Descreva, em passos, como usar o Git para descobrir <b>o que exatamente mudou</b>, e o que você procuraria.",
            "modelo": "<p><b>Como descobrir:</b></p><ol><li><code>git switch main</code> e <code>git pull</code>: partir da versão atual.</li><li><code>git log --oneline -20</code>: ver os commits recentes e suas mensagens.</li><li><code>git log --oneline -- caminho/da/area</code>: restringir à área que te interessa.</li><li><code>git show &lt;hash&gt;</code> ou a aba <b>Files changed</b> do PR: ver as linhas em si.</li></ol><p><b>O que procurar no diff</b> (é aqui que está o valor):</p><ul><li><b>Arquivos fora do escopo</b>: a história era sobre carrinho e o diff mexe em autenticação? Pergunte.</li><li><b>Números que mudaram</b>: limites, percentuais, tamanhos máximos. Cada um é um caso de valor limite.</li><li><b>Condições que mudaram</b>: um <code>&gt;</code> que virou <code>&gt;=</code>, um <code>and</code> que virou <code>or</code>. São as mudanças de uma linha que mais causam defeito.</li><li><b>Linhas removidas</b>: uma validação apagada é um caminho que ficou aberto.</li><li><b>Veio teste junto?</b> Mudança de comportamento sem nenhum teste novo é pergunta legítima na revisão.</li><li><b>Migração de banco?</b> Então há risco de dados, vale conferir no banco depois de subir.</li></ul><p>Se a sua resposta parou em \"leio os commits\", falta a segunda metade: o valor está em <b>o que você procura</b> no diff, não em conseguir abri-lo.</p>",
            "dica": "dois blocos: os comandos, e depois o que você examina no resultado."
