  window.PROVA = {
    titulo: "Módulo 3", trilha: "pytest", modulo: 3, indiceHref: "index.html",
    questoes: [
      {
            "t": "mc",
            "enun": "Qual é o padrão usado para transformar uma query de validação em teste?",
            "ops": [
                  "A query traz <b>só as linhas que violam a regra</b>, e o assert confere que a lista veio vazia",
                  "A query traz todas as linhas, e o teste conta quantas estão certas",
                  "A query é comparada com um arquivo de resultado esperado salvo no repositório",
                  "O teste roda a query duas vezes e compara os resultados"

            "correta": 0,
            "exp": "<code>assert ruins == []</code>. Simples, direto, e a mensagem lista quais linhas quebraram."

      {
            "t": "mc",
            "enun": "Por que a mensagem do assert deve listar os ids das linhas com problema?",
            "ops": [
                  "Porque no CI ninguém está olhando a tela na hora da falha — a mensagem é o que permite investigar depois",
                  "Porque o pytest exige mensagem em todo assert",
                  "Porque sem ela o teste não falha corretamente",
                  "Porque aumenta a cobertura de código do projeto"
            ],
            "correta": 0,
            "exp": "Num pipeline, a mensagem do assert é o relatório de bug. Vale o mesmo cuidado do título de um defeito."
      },
      {
            "t": "mc",
            "enun": "Nem toda validação é \"tem que dar zero\". Qual é um exemplo legítimo de assert sobre proporção?",
            "ops": [
                  "<code>assert sem_defeito / total_falhas &lt;= 0.30</code> — vigiar um teto aceitável em vez de exigir perfeição",
                  "<code>assert total_falhas == 0</code> — nenhuma execução pode falhar",
                  "<code>assert len(linhas) &gt; 0</code> — sempre deve haver linhas",
                  "<code>assert True</code> — garantir que o teste roda"
            ],
            "correta": 0,
            "exp": "Regras \"moles\" existem: não é erro grave, mas você quer ser avisado se passar do teto. O assert aceita qualquer expressão booleana."

      {
            "t": "mc",
            "enun": "Qual a diferença entre <code>skip</code> e <code>xfail</code>?",

                  "<code>skip</code> nem executa o teste; <code>xfail</code> executa e confere que ele continua quebrado",

                  "<code>xfail</code> ignora o resultado; <code>skip</code> registra a falha",

            "correta": 0,
            "exp": "Por isso <code>xfail</code> é honesto: ele continua monitorando o problema, em vez de fingir que ele não existe."

                  "Exige que a razão do xfail esteja documentada"

            "correta": 0,

                  "Os testes dependem de uma funcionalidade ainda não implementada",
                  "Os testes são lentos demais para rodar no CI"

            "correta": 0,

            "modelo": "<pre class=\"bloco\"><code>def test_defeito_fechado_tem_data_de_fechamento(db):\n    ruins = db.execute(\n        \"\"\"\n        SELECT id, status\n        FROM defeitos\n        WHERE status IN ('fechado', 'resolvido')\n          AND data_fechamento IS NULL\n        \"\"\"\n    ).fetchall()\n    assert ruins == [], f\"defeitos fechados sem data: {[r['id'] for r in ruins]}\"</code></pre><p><b>Se ficasse vermelho num projeto real</b>, a sequência seria:</p><ol><li><b>Confirmar no banco:</b> rodar a query à mão e olhar as linhas — quantas são, de quando, de qual módulo.</li><li><b>Decidir o que é o defeito:</b> o dado está torto (alguém fechou sem preencher) ou a <em>regra</em> é que está errada (existe um fluxo legítimo de fechar sem data)? Essa pergunta é do Módulo 5 de Fundamentos: pode ser que o defeito esteja na especificação.</li><li><b>Abrir o relatório</b> com os ids como evidência, severidade e prioridade justificadas separadamente.</li><li><b>Manter o teste vermelho</b>, ou marcá-lo com <code>xfail(strict=True)</code> enquanto o dado não é corrigido — nunca apagá-lo. Com <code>strict</code>, no dia da correção o build avisa que o marcador pode sair.</li></ol><p>O que <b>não</b> se faz: afrouxar o assert para a suíte ficar verde. Isso transforma o teste num enfeite.</p>",
            "dica": "lembre que a regra também vale ao contrário: aberto não pode ter data de fechamento."
      }
