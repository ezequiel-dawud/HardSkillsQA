  <script>
  window.PROVA = {
    titulo: "Módulo 2", trilha: "cicd", modulo: 2, indiceHref: "index.html",
    questoes: [
      {
            "t": "mc",
            "enun": "Em YAML, o que define o aninhamento?",
            "ops": [
                  "A indentação com espaços — e nunca Tab, que quebra o arquivo",
                  "As chaves <code>{ }</code>, como em JSON",
                  "O traço no início da linha",
                  "A ordem em que as chaves aparecem"
            ],
            "correta": 0,
            "exp": "Erro de indentação é o problema número um de quem edita workflow pela primeira vez."
      },
      {
            "t": "mc",
            "enun": "O que o traço <code>-</code> no início de uma linha YAML indica?",
            "ops": [
                  "Um item de lista",
                  "Um comentário",
                  "Uma continuação da linha anterior",
                  "Um valor nulo"
            ],
            "correta": 0,
            "exp": "Vários traços no mesmo nível de indentação = vários itens da mesma lista. É assim que os <code>steps</code> são escritos."
      },
      {
            "t": "mc",
            "enun": "O que a seção <code>on:</code> de um workflow define?",
            "ops": [
                  "Quando o pipeline dispara — por exemplo, em push, em pull request, ou manualmente",
                  "Em qual sistema operacional o job roda",
                  "Quais comandos serão executados",
                  "Quais pessoas podem aprovar a execução"
            ],
            "correta": 0,
            "exp": "No workflow do projeto ela combina três gatilhos: <code>push</code>, <code>pull_request</code> e <code>workflow_dispatch</code> (o botão \"Run workflow\")."
      },
      {
            "t": "mc",
            "enun": "Qual a diferença entre <code>uses:</code> e <code>run:</code> num step?",
            "ops": [
                  "<code>uses:</code> chama uma ação pronta feita por outra pessoa; <code>run:</code> executa um comando de terminal seu",
                  "<code>uses:</code> executa comandos e <code>run:</code> importa bibliotecas",
                  "<code>uses:</code> vale para o job e <code>run:</code> para o workflow inteiro",
                  "São equivalentes; <code>uses:</code> é a forma mais nova"
            ],
            "correta": 0,
            "exp": "<code>actions/checkout@v4</code> é uma ação pronta que baixa o código; <code>pytest</code> é um comando seu."
      },
      {
            "t": "mc",
            "enun": "Para que serve <code>paths:</code> dentro do gatilho de push?",
            "ops": [
                  "Disparar o pipeline apenas quando arquivos daqueles caminhos mudarem",
                  "Definir em qual pasta os comandos serão executados",
                  "Indicar onde os relatórios serão salvos",
                  "Listar os arquivos que serão enviados como artefato"
            ],
            "correta": 0,
            "exp": "Evita rodar a suíte inteira quando alguém só mexeu no README. Para escolher a pasta de execução existe <code>working-directory</code>."
      },
      {
            "t": "mc",
            "enun": "O que <code>runs-on: ubuntu-latest</code> significa?",
            "ops": [
                  "Que o job será executado numa máquina virtual Linux limpa, fornecida pelo GitHub",
                  "Que o código precisa ser compatível apenas com Ubuntu",
                  "Que o pipeline só roda se o desenvolvedor usar Linux",
                  "Que a aplicação será publicada num servidor Ubuntu"
            ],
            "correta": 0,
            "exp": "\"Limpa\" é a palavra-chave: a máquina nasce vazia a cada execução, e é por isso que o pipeline precisa instalar tudo explicitamente."
      },
      {
            "t": "aberta",
            "enun": "Descreva, passo a passo e em português, o que o workflow <code>trilha-3-pytest.yml</code> faz — desde o gatilho até o resultado — e explique por que a ordem dos passos importa.",
            "modelo": "<p><b>O que ele faz:</b></p><ol><li><b>Dispara</b> quando há push ou pull request que toque em <code>trilha-3/**</code>, no banco <code>pratica/pratica.db</code> ou no próprio arquivo do workflow — e também manualmente, pelo botão <i>Run workflow</i>.</li><li><b>Cria uma máquina virtual Linux limpa</b> (<code>ubuntu-latest</code>), sem nada instalado.</li><li><b>Baixa o código</b> do repositório para dentro dela (<code>actions/checkout@v4</code>).</li><li><b>Instala o Python 3.12</b> (<code>actions/setup-python@v5</code>).</li><li><b>Instala as dependências</b> a partir de <code>requirements.txt</code>, executando de dentro de <code>trilha-3/</code>.</li><li><b>Roda <code>pytest</code></b>, também de dentro de <code>trilha-3/</code>.</li><li><b>Decide o resultado</b> pelo código de saída: 0 marca o run como ✓; qualquer outro número derruba o passo e marca ✗ — e o check aparece assim no Pull Request.</li></ol><p><b>Por que a ordem importa:</b> cada passo depende do anterior, e a máquina começa vazia.</p><ul><li>Sem o <b>checkout</b>, não existem arquivos — nem o <code>requirements.txt</code> nem os testes.</li><li>Sem o <b>setup-python</b>, não há o <code>pip</code> na versão certa para instalar.</li><li>Sem a <b>instalação</b>, <code>pytest</code> não existe e o passo falharia com \"command not found\" — um vermelho que não tem nada a ver com a qualidade do código.</li><li>O <code>working-directory: trilha-3</code> importa porque os caminhos dos testes são relativos: a fixture procura o banco em <code>../pratica/pratica.db</code>. Rodando de outro lugar, o resultado seria ERROR, não FAILED.</li></ul><p>A ideia central: <b>o pipeline é a receita de como reconstruir o ambiente do zero</b>. Se ele passa, qualquer pessoa consegue rodar aqueles testes numa máquina nova seguindo exatamente aqueles passos.</p>",
            "dica": "lembre que a máquina nasce vazia — o que precisa existir antes de cada passo?"
      }
]
  };
