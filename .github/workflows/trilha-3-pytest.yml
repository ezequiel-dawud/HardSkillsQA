name: Trilha 3 — pytest

# Roda só quando algo que afeta os testes muda (ou manualmente pelo botão
# "Run workflow" na aba Actions do GitHub).
on:
  push:
    paths:
      - "trilha-3/**"
      - "pratica/pratica.db"
      - ".github/workflows/trilha-3-pytest.yml"
  pull_request:
    paths:
      - "trilha-3/**"
      - "pratica/pratica.db"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        working-directory: trilha-3
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar os testes
        working-directory: trilha-3
        run: pytest
